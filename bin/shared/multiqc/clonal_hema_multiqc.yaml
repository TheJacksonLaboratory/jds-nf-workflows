title: "Clonal Hematopoiesis Panel QC Summary Report"
intro_text: This report has been generated by the <a href="https://github.com/TheJacksonLaboratory/cs-nf-pipelines" target="_blank">JAX NGS Operations Nextflow DSL2 Pipelines</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://github.com/TheJacksonLaboratory/jds-nf-workflows/wiki" target="_blank">wiki documentation</a>.

export_plots: true

module_order:
  - fastp
  - fastqc
  - samtools
  - gatk
  - picard
  - bcftools

fastp:
  use_filename_as_sample_name: true

table_columns_visible:
  FastQC:
    percent_duplicates: False
    percent_gc: False
    total_sequences: False

extra_fn_clean_exts:
  - "_aln"
  - "_sortsam"
  - "_dedup"
  - "_R1"
  - "_R2"
  - "_fastp"
  - "fastp report"
  - "_mutect2_somatic.filtered"
  - "_mutect2_somatic"
  - ".mutect2_somatic.final"
  - ".mutect2_somatic.filtered"
  - ".mutect2_somatic"
  - type: "truncate"
    pattern: ".fastq"

custom_logo: "./JAX_logo_rgb_transparentback.png"
custom_logo_dark: "./JAX_logo_white_transparentback.png"
custom_logo_url: "https://github.com/TheJacksonLaboratory/cs-nf-pipelines"
custom_logo_title: "The Jackson Laboratory - NGS Operations Nextflow DSL2 Pipelines"

# Modification list items 1 and 5 (clonal_Hema/notes/pipeline_modification_list.md, 2026-11-12).
# Item 1: samtools flagstat and Picard CollectHsMetrics in this report run on the UMI consensus BAM
# (one read pair per original molecule), not the raw BAM. Label the columns so they are not read as all reads.
# Keys: table anchor -> column id (MultiQC 1.34 plots/table_object.py: custom_table_header_config).
custom_table_header_config:
  general_stats_table:
    samtools_flagstat-flagstat_total:
      title: "Consensus reads"
      description: "Reads in the UMI consensus BAM (samtools flagstat), not raw sequenced reads"
    samtools_flagstat-mapped_passed:
      title: "Consensus reads mapped"
      description: "Mapped reads in the UMI consensus BAM (samtools flagstat), not raw sequenced reads"
    samtools_flagstat-mapped_passed_pct:
      title: "% Consensus mapped"
      description: "% of consensus reads mapped (samtools flagstat of the UMI consensus BAM)"
    picard_hsmetrics-FOLD_ENRICHMENT:
      title: "Fold Enrichment (consensus)"
      description: "Picard CollectHsMetrics on the UMI consensus BAM: fold by which the baited region is enriched above genomic background"
    picard_hsmetrics-MEDIAN_TARGET_COVERAGE:
      title: "Median Target Coverage (consensus)"
      description: "Picard CollectHsMetrics on the UMI consensus BAM: median coverage of targets"
    picard_hsmetrics-picard_target_bases_30X:
      title: "Target Bases ≥ 30X (consensus)"
      description: "Picard CollectHsMetrics on the UMI consensus BAM: % of target bases with coverage ≥ 30X"
  picard_hsmetrics_table:
    PF_READS:
      title: "PF reads (consensus)"
      description: "Reads in the UMI consensus BAM that pass the vendor filter (shown in millions: a few thousand reads shows as 0.0M)"
    TOTAL_READS:
      title: "Total reads (consensus)"
      description: "Reads in the UMI consensus BAM"

section_comments:
  picard_hsmetrics: "All values in this section come from Picard CollectHsMetrics on the <b>UMI consensus BAM</b> (one read pair per original molecule), not the raw BAM. Read counts are consensus reads."
  samtools-flagstat: "samtools flagstat of the <b>UMI consensus BAM</b> (one read pair per original molecule), not the raw BAM."

# Item 5: drop the four bcftools per-sample plots (one tab per sample). Sites = 'Vars' and Ts/Tv are in General
# Statistics; singletons = all calls in single-sample VCFs; 'Sequencing depth' = mean DP at called sites only.
# Anchors from MultiQC 1.34 modules/bcftools/stats.py.
remove_sections:
  - bcftools-stats_sites_per_sample
  - bcftools-stats_ts_tv
  - bcftools-stats_singletones
  - bcftools-stats_sequencing_depth
